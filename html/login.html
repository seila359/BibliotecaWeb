<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar - Minha Biblioteca</title>

    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>

  <body>
    <header>
      <h1>📚 Minha Biblioteca</h1>
    </header>

    <section class="hero">
      <h2>Bem vindo, Leitor</h2>
      <p>Identifique-se para acessar seus empréstimos.</p>
    </section>

    <main class="container">
      <div id="alert-box" class="alert"></div>

      <div class="card login-card">
        <h3>Acessar a Conta</h3>

        <!-- Removido o onsubmit manual e adicionado id="login-form" -->
        <form id="login-form" data-action="login">
          <div class="form-group">
            <label for="user-login">Matrícula ou E-mail</label>
            <input
              type="text"
              id="user-login"
              class="form-input"
              placeholder="Digite seu usuário..."
              required
            />
          </div>

          <div class="form-group">
            <label for="user-pass">Senha</label>
            <input
              type="password"
              id="user-pass"
              class="form-input"
              placeholder="••••••••"
              required
            />
          </div>

          <button type="submit" class="button">Entrar no Sistema</button>
        </form>

        <div class="gsi-material-button-container">
          <button class="gsi-material-button" id="btn-google">
            <div class="gsi-material-button-state"></div>
            <div class="gsi-material-button-content-wrapper">
              <div class="gsi-material-button-icon">
                <svg
                  version="1.1"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 48 48"
                  xmlns:xlink="http://www.w3.org/1999/xlink"
                  style="display: block"
                >
                  <path
                    fill="#EA4335"
                    d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
                  ></path>
                  <path
                    fill="#4285F4"
                    d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
                  ></path>
                  <path
                    fill="#FBBC05"
                    d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
                  ></path>
                  <path
                    fill="#34A853"
                    d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
                  ></path>
                  <path fill="none" d="M0 0h48v48H0z"></path>
                </svg>
              </div>
              <span class="gsi-material-button-contents"
                >Sign in with Google</span
              >
              <span style="display: none">Sign in with Google</span>
            </div>
          </button>
        </div>

        <hr />

        <p id="signup-link">
          Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
        </p>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Minha Biblioteca. Todos os direitos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../src/common/common.js"></script>
    <script type="module" src="../src/login/login.js"></script>
  </body>
</html>
