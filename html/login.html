<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Minha Biblioteca</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <header>
        <h1>📚 Minha Biblioteca</h1>
    </header>

    <section class="hero">
        <h2>Acesso ao Leitor</h2>
        <p>Identifique-se para acessar seus empréstimos.</p>
    </section>

    <main class="container">

        <div id="alert-box" class="alert"></div>

        <div class="card login-card">
            <h3>Acessar a Conta</h3>

            <form onsubmit="fazerLogin(event)">
                <div class="form-group">
                    <label for="user-login">Matrícula ou E-mail</label>
                    <input type="text" id="user-login" class="form-input" placeholder="Digite seu usuário..." required>
                </div>

                <div class="form-group">
                    <label for="user-pass">Senha</label>
                    <input type="password" id="user-pass" class="form-input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="button">Entrar no Sistema</button>
            </form>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 Minha Biblioteca. Todos os direitos reservados.</p>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../src/config.js"></script>
    <script src="../src/common.js"></script>
    <script src="../src/login.js"></script>
</body>
</html>
